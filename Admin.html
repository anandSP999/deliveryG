<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Gravity | Master Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root { --primary: #6366f1; --bg: #030712; --glass: rgba(15, 23, 42, 0.8); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: white; overflow: hidden; }
        
        /* Glassmorphism */
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .input-box { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.1); outline: none; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); background: rgba(30, 41, 59, 0.8); }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row">

    <div id="login-screen" class="fixed inset-0 z-50 bg-[#030712] flex items-center justify-center p-4">
        <div class="glass p-10 rounded-3xl w-full max-w-md text-center animate-fade">
            <h1 class="text-3xl font-black italic mb-2 tracking-tighter">GRAVITY<span class="text-indigo-500">.OS</span></h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest mb-8">Secure Admin Access</p>
            
            <input type="email" id="email" placeholder="admin@gravity.co" class="input-box w-full p-4 rounded-xl mb-3 text-sm">
            <input type="password" id="password" placeholder="••••••••" class="input-box w-full p-4 rounded-xl mb-6 text-sm">
            
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition">
                Enter System
            </button>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Invalid Credentials</p>
        </div>
    </div>

    <aside class="hidden md:flex flex-col w-64 glass border-r-0 border-r-white/5 h-full p-6 z-10">
        <div class="mb-10">
            <h2 class="text-xl font-black italic">GRAVITY<span class="text-indigo-500">.CO</span></h2>
        </div>
        
        <nav class="flex-1 space-y-2">
            <button onclick="showTab('dashboard')" id="btn-dashboard" class="w-full text-left p-3 rounded-xl hover:bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-3">
                <i class="fa-solid fa-chart-pie"></i> Dashboard
            </button>
            <button onclick="showTab('projects')" id="btn-projects" class="w-full text-left p-3 rounded-xl hover:bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-3">
                <i class="fa-solid fa-folder-open"></i> Deliveries
            </button>
            <button onclick="showTab('invoices')" id="btn-invoices" class="w-full text-left p-3 rounded-xl hover:bg-white/5 text-slate-400 hover:text-white transition flex items-center gap-3">
                <i class="fa-solid fa-file-invoice"></i> Finance
            </button>
        </nav>

        <button onclick="logout()" class="p-3 text-xs text-slate-500 hover:text-red-400 text-left transition">
            <i class="fa-solid fa-power-off mr-2"></i> Shutdown
        </button>
    </aside>

    <main class="flex-1 relative overflow-y-auto h-full p-4 md:p-8">
        
        <div class="md:hidden flex justify-between items-center mb-6">
            <h2 class="font-black italic">GRAVITY</h2>
            <button onclick="logout()" class="text-slate-400"><i class="fa-solid fa-power-off"></i></button>
        </div>

        <div id="tab-dashboard" class="tab-section hidden animate-fade space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass p-6 rounded-2xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Revenue</p>
                    <h2 class="text-3xl font-black mt-2" id="dash-rev">₹0</h2>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Pending Projects</p>
                    <h2 class="text-3xl font-black mt-2 text-amber-500" id="dash-pending">0</h2>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <p class="text-slate-500 text-xs font-bold uppercase">Total Views</p>
                    <h2 class="text-3xl font-black mt-2 text-indigo-400" id="dash-views">0</h2>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl h-64 md:h-96">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div id="tab-projects" class="tab-section hidden animate-fade space-y-6">
            <div class="flex flex-col md:flex-row justify-between gap-4">
                <input type="text" id="search-input" onkeyup="filterProjects()" placeholder="Search clients..." class="input-box px-4 py-3 rounded-xl w-full md:w-80 text-sm">
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/20">
                    + New Project
                </button>
            </div>

            <div id="projects-grid" class="grid grid-cols-1 gap-4">
                </div>
        </div>

        <div id="tab-invoices" class="tab-section hidden animate-fade">
            <div class="glass rounded-3xl p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Invoice Database</h2>
                    <button onclick="exportAllInvoices()" class="bg-green-600/20 text-green-400 px-4 py-2 rounded-lg text-xs font-bold border border-green-500/30 hover:bg-green-600 hover:text-white transition">
                        Download All (Excel)
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-400">
                        <thead class="text-xs uppercase text-slate-500 border-b border-white/5">
                            <tr>
                                <th class="pb-3 pl-2">ID</th>
                                <th class="pb-3">Client</th>
                                <th class="pb-3">Amount</th>
                                <th class="pb-3 text-right pr-2">Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoice-list">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div id="modal" class="hidden fixed inset-0 z-40 bg-black/80 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-2xl animate-fade overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-1">Project Details</h2>
            <p class="text-xs text-indigo-400 mb-6">Paste raw Google Drive links. System will fix them automatically.</p>
            
            <form onsubmit="saveProject(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input id="m-id" required placeholder="Project ID (e.g. client01)" class="input-box p-4 rounded-xl w-full">
                    <input id="m-name" required placeholder="Client Name" class="input-box p-4 rounded-xl w-full">
                </div>
                <input id="m-title" required placeholder="Project Title" class="input-box p-4 rounded-xl w-full">
                <input id="m-price" type="number" required placeholder="Price (INR)" class="input-box p-4 rounded-xl w-full">
                
                <div class="space-y-2 pt-2 border-t border-white/5">
                    <label class="text-xs text-slate-500 uppercase font-bold">Google Drive Links</label>
                    <input id="m-vid" required placeholder="Video Link (Paste regular link)" class="input-box p-3 rounded-lg w-full text-xs font-mono text-indigo-300">
                    <input id="m-qr" required placeholder="QR Code Image Link" class="input-box p-3 rounded-lg w-full text-xs font-mono text-indigo-300">
                    <input id="m-file" required placeholder="Final Download Link (Zip/Folder)" class="input-box p-3 rounded-lg w-full text-xs font-mono text-indigo-300">
                </div>

                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold">Cancel</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold shadow-lg shadow-indigo-500/20">Save & Fix Links</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION (REPLACE THESE KEYS!)
        const firebaseConfig = {
            apiKey: "AIzaSyClH2MyqJG0qkuOT5LokfxdYlLY8guW79Q",
            authDomain: "videodelivery-1.firebaseapp.com",
            databaseURL: "https://videodelivery-1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "videodelivery-1",
            storageBucket: "videodelivery-1.firebasestorage.app",
            messagingSenderId: "172604228077",
            appId: "1:172604228077:web:1275b0733029b19aefa7e4"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase Connected");
        } catch(e) {
            alert("Firebase Error: Check your config keys in the code!");
        }

        const auth = firebase.auth();
        const db = firebase.database();
        let projectsData = {};

        // 2. AUTH SYSTEM
        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p)
                .then(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    initApp();
                })
                .catch(err => {
                    document.getElementById('login-error').style.display = 'block';
                    document.getElementById('login-error').innerText = err.message;
                });
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('login-screen').style.display = 'none';
                initApp();
            }
        });

        // 3. MAIN APP LOGIC
        function initApp() {
            showTab('projects'); // Default tab
            
            // Listen to Realtime Database
            db.ref('projects').on('value', snapshot => {
                projectsData = snapshot.val() || {};
                renderAll();
            });
        }

        function renderAll() {
            renderDashboard();
            renderProjectsList();
            renderInvoiceList();
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            let rev = 0, pending = 0, views = 0;
            Object.values(projectsData).forEach(p => {
                if(p.paid) rev += parseInt(p.p);
                else pending++;
                views += (p.viewCount || 0);
            });

            document.getElementById('dash-rev').innerText = `₹${rev.toLocaleString()}`;
            document.getElementById('dash-pending').innerText = pending;
            document.getElementById('dash-views').innerText = views;

            // Simple Chart
            const ctx = document.getElementById('revenueChart').getContext('2d');
            // Destroy old chart if exists (simple hack: recreate canvas or just ignore errors)
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Start', 'Now'],
                    datasets: [{
                        label: 'Total Revenue',
                        data: [0, rev],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: {display:false} },
                    scales: { x: {display:false}, y: {grid:{color:'rgba(255,255,255,0.05)'}} }
                }
            });
        }

        // --- PROJECTS ---
        function renderProjectsList() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            
            Object.entries(projectsData).reverse().forEach(([id, p]) => { // Reverse to show newest first
                const statusColor = p.paid ? 'text-green-400 border-green-500/30 bg-green-500/10' : 'text-amber-400 border-amber-500/30 bg-amber-500/10';
                const statusText = p.paid ? 'UNLOCKED' : 'LOCKED';
                
                const card = `
                <div class="glass p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 project-card">
                    <div class="flex-1 text-center md:text-left">
                        <div class="flex items-center justify-center md:justify-start gap-2 mb-1">
                            <span class="text-[10px] font-mono bg-slate-800 px-2 py-1 rounded text-slate-500">${id}</span>
                            <h3 class="font-bold text-lg">${p.cn}</h3>
                        </div>
                        <p class="text-sm text-slate-400">${p.t}</p>
                        <p class="text-xs text-slate-500 mt-2">Views: ${p.viewCount || 0}</p>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <div class="text-right mr-4 hidden md:block">
                            <p class="font-bold text-xl">₹${p.p}</p>
                            <p class="text-[10px] text-slate-500 uppercase">Amount</p>
                        </div>
                        
                        <button onclick="toggleLock('${id}', ${!p.paid})" class="border px-4 py-2 rounded-lg text-xs font-bold ${statusColor} hover:bg-white/5 transition">
                            ${statusText}
                        </button>
                        
                        <button onclick="deleteProject('${id}')" class="bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 p-3 rounded-xl transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
                grid.innerHTML += card;
            });
        }

        // --- INVOICES ---
        function renderInvoiceList() {
            const list = document.getElementById('invoice-list');
            list.innerHTML = '';
            Object.entries(projectsData).forEach(([id, p]) => {
                list.innerHTML += `
                <tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="py-3 pl-2 font-mono text-xs text-indigo-400">${id}</td>
                    <td class="py-3 font-semibold">${p.cn}</td>
                    <td class="py-3">₹${p.p}</td>
                    <td class="py-3 text-right pr-2">
                        <button onclick="downloadOneInvoice('${id}')" class="text-xs bg-slate-800 px-3 py-1 rounded hover:text-white transition">
                            Download
                        </button>
                    </td>
                </tr>`;
            });
        }

        // 4. ACTION FUNCTIONS
        
        // --- THE MAGIC LINK FIXER ---
        function fixDriveLink(url, type) {
            if(!url) return "";
            if(!url.includes("drive.google.com")) return url;

            // 1. Extract ID
            let id = "";
            const parts = url.split('/');
            for(let i=0; i<parts.length; i++) {
                if(parts[i] === 'd') id = parts[i+1];
            }
            if(!id && url.includes('id=')) id = url.split('id=')[1].split('&')[0];

            if(!id) return url; // Couldn't find ID, return original

            // 2. Return correct format based on type
            if(type === 'download') return `https://drive.google.com/uc?export=download&id=${id}`;
            return `https://drive.google.com/uc?export=view&id=${id}`; // For video and images
        }

        function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('m-id').value.trim();
            
            // Collect and Fix Data
            const data = {
                cn: document.getElementById('m-name').value,
                t: document.getElementById('m-title').value,
                p: document.getElementById('m-price').value,
                // Apply the fixers here!
                v: fixDriveLink(document.getElementById('m-vid').value, 'view'),
                q: fixDriveLink(document.getElementById('m-qr').value, 'view'),
                f: fixDriveLink(document.getElementById('m-file').value, 'download'),
                paid: false, 
                viewCount: 0
            };

            db.ref('projects/' + id).set(data)
                .then(() => {
                    closeModal();
                    alert("Project Saved! Links have been auto-fixed.");
                    document.querySelector('form').reset();
                })
                .catch(err => alert("Error: " + err.message));
        }

        function toggleLock(id, status) {
            db.ref('projects/' + id).update({ paid: status });
        }

        function deleteProject(id) {
            if(confirm('Are you sure you want to delete ' + id + '? This cannot be undone.')) {
                db.ref('projects/' + id).remove();
            }
        }

        function filterProjects() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.project-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        // --- EXPORTING ---
        function exportAllInvoices() {
            const data = [];
            Object.values(projectsData).forEach(p => {
                data.push({
                    "Client": p.cn,
                    "Project": p.t,
                    "Price": p.p,
                    "Status": p.paid ? "Paid" : "Pending",
                    "Views": p.viewCount
                });
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Invoices");
            XLSX.writeFile(wb, "Gravity_Finance_Report.xlsx");
        }

        function downloadOneInvoice(id) {
            const p = projectsData[id];
            const data = [{
                "Invoice ID": id.toUpperCase(),
                "Client Name": p.cn,
                "Project": p.t,
                "Amount": p.p,
                "GST (18%)": Math.round(p.p * 0.18),
                "Total": Math.round(p.p * 1.18),
                "Date": new Date().toLocaleDateString()
            }];
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Invoice");
            XLSX.writeFile(wb, `Invoice_${p.cn}.xlsx`);
        }

        // --- UI UTILS ---
        function showTab(id) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            
            // Highlight sidebar button
            document.querySelectorAll('aside button').forEach(b => {
                b.classList.remove('bg-white/10', 'text-white');
                b.classList.add('text-slate-400');
            });
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('bg-white/10', 'text-white');
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    </script>
</body>
</html>
